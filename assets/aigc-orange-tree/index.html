<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orange Tree Music Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #010201;
      --fg: #f3f5df;
      --muted: rgba(243, 245, 223, 0.64);
      --panel: rgba(18, 23, 15, 0.68);
      --line: rgba(243, 245, 223, 0.16);
      --orange: #ff9f24;
      --green: #94d755;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .visualizer {
      position: relative;
      width: min(100%, 1160px);
      min-height: min(760px, calc(100vh - 36px));
      overflow: hidden;
      border: 1px solid rgba(243, 245, 223, 0.09);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 58%, rgba(255, 159, 36, 0.028), transparent 22%),
        radial-gradient(circle at 49% 52%, rgba(148, 215, 85, 0.026), transparent 38%),
        linear-gradient(180deg, #010201 0%, #030502 100%);
      isolation: isolate;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 58px 14px 14px;
    }

    .work-header {
      position: absolute;
      left: 16px;
      right: 16px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: rgba(243, 245, 223, 0.78);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .work-header {
      top: 16px;
    }

    .track-title,
    .copyright {
      overflow-wrap: anywhere;
    }

    button,
    label {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--fg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    button {
      padding: 0 13px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: rgba(255, 159, 36, 0.46);
      box-shadow: 0 0 18px rgba(255, 159, 36, 0.07);
    }

    label {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 0 10px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 128px;
      accent-color: var(--orange);
    }

    .status {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, auto) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .copyright {
      justify-self: center;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #meter {
      justify-self: end;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .visualizer {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .topbar {
        align-items: stretch;
        padding-top: 74px;
      }

      .work-header {
        left: 12px;
        right: 12px;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
      }

      button,
      label {
        flex: 1 1 132px;
      }

      input[type="range"] {
        width: 100%;
      }

      .status {
        left: 12px;
        right: 12px;
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      #meter {
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <main class="visualizer" id="visualizer">
    <canvas aria-label="橘子树粒子音乐可视化"></canvas>
    <header class="work-header" aria-label="作品音乐信息">
      <span class="track-title">Blood and thirst (King of Hurts)</span>
      <span>by. The Black Skirts - THIRSTY</span>
    </header>
    <div class="topbar">
      <button type="button" id="play">播放音乐</button>
      <button type="button" id="scatter">散开</button>
      <button type="button" id="form" aria-pressed="true">聚成树</button>
    </div>
    <div class="status">
      <span id="mode">等待播放音频</span>
      <span class="copyright">COPYRIGHT© 2026 JIAYI WU - WU STUDIO ALL RIGHTS RESERVED.</span>
      <span id="meter">0 particles</span>
    </div>
    <audio id="track" src="orange-tree-track.mp3" preload="auto" autoplay loop></audio>
  </main>

  <script>
    (() => {
      const root = document.getElementById("visualizer");
      const canvas = root.querySelector("canvas");
      const ctx = canvas.getContext("2d", { alpha: true });
      const playButton = document.getElementById("play");
      const scatterButton = document.getElementById("scatter");
      const formButton = document.getElementById("form");
      const mode = document.getElementById("mode");
      const meter = document.getElementById("meter");
      const track = document.getElementById("track");

      let width = 1;
      let height = 1;
      let dpr = 1;
      let audioContext;
      let analyser;
      let frequencyData;
      let source;
      let playing = false;
      let formed = true;
      let manualBurst = 0;
      let rhythmSmoothed = 0;
      let cyclePhase = 0.86;
      let cycleMode = 0;
      let previousCyclePhase = cyclePhase;
      let pointer = { x: 0, y: 0, active: false };

      const targets = [];
      const particles = [];
      const palette = {
        leaf: [78, 132, 48],
        leafLight: [126, 170, 78],
        orange: [194, 99, 25],
        orangeLight: [218, 139, 44],
        wood: [112, 82, 62],
        dust: [146, 141, 111]
      };

      const rand = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function addTarget(x, y, kind, size, drift) {
        targets.push({ x, y, kind, size, drift });
      }

      function ellipsePoint(cx, cy, rx, ry) {
        const angle = rand(0, Math.PI * 2);
        const radius = Math.sqrt(Math.random());
        return {
          x: cx + Math.cos(angle) * rx * radius,
          y: cy + Math.sin(angle) * ry * radius
        };
      }

      function buildTree() {
        targets.length = 0;

        const canopyBlobs = [
          [-0.2, -0.29, 0.24, 0.34],
          [0.08, -0.34, 0.27, 0.38],
          [0.25, -0.18, 0.22, 0.3],
          [-0.32, -0.12, 0.18, 0.25],
          [-0.02, -0.08, 0.28, 0.3],
          [0.0, -0.49, 0.16, 0.18],
          [0.34, -0.39, 0.13, 0.2],
          [-0.38, -0.33, 0.13, 0.18]
        ];

        for (let i = 0; i < 3600; i++) {
          const blob = canopyBlobs[Math.floor(Math.random() * canopyBlobs.length)];
          const p = ellipsePoint(blob[0], blob[1], blob[2], blob[3]);
          const airyTop = p.y < -0.42 && Math.random() < 0.2;
          const edge = Math.abs(p.x) + Math.max(0, -p.y - 0.18);
          if (edge > 0.78 && Math.random() < 0.45) continue;
          addTarget(p.x + rand(-0.012, 0.012), p.y + rand(-0.012, 0.012), airyTop ? "leafLight" : "leaf", rand(0.38, 0.95), rand(0.7, 1.9));
        }

        const fruitAnchors = [
          [-0.32, -0.28, 0.044], [-0.24, -0.38, 0.036], [-0.12, -0.23, 0.035],
          [-0.06, -0.44, 0.032], [0.08, -0.32, 0.042], [0.18, -0.43, 0.034],
          [0.23, -0.2, 0.04], [0.34, -0.28, 0.032], [0.3, -0.04, 0.028],
          [-0.24, -0.05, 0.03], [0.04, -0.08, 0.034], [-0.43, -0.15, 0.025],
          [0.41, -0.38, 0.023], [0.15, -0.02, 0.026], [-0.05, -0.58, 0.02]
        ];

        for (let i = 0; i < 700; i++) {
          const anchor = fruitAnchors[Math.floor(Math.random() * fruitAnchors.length)];
          const angle = rand(0, Math.PI * 2);
          const radius = Math.sqrt(Math.random()) * anchor[2];
          addTarget(anchor[0] + Math.cos(angle) * radius, anchor[1] + Math.sin(angle) * radius, Math.random() > 0.22 ? "orange" : "orangeLight", rand(0.72, 1.55), rand(0.35, 1.0));
        }

        for (let i = 0; i < 980; i++) {
          const t = Math.random();
          const split = Math.random() > 0.52 ? 1 : -1;
          const trunkX = split * (0.035 + t * 0.055) + Math.sin(t * 4.2) * 0.012;
          const trunkY = 0.27 - t * 0.58;
          const widthAtT = 0.026 + (1 - t) * 0.028;
          addTarget(trunkX + rand(-widthAtT, widthAtT), trunkY + rand(-0.006, 0.006), "wood", rand(0.48, 1.12), rand(0.25, 0.8));
        }

        for (let i = 0; i < 620; i++) {
          const side = Math.random() > 0.5 ? 1 : -1;
          const t = Math.random();
          const x = side * (0.02 + t * rand(0.08, 0.32));
          const y = 0.04 - t * rand(0.22, 0.5) + Math.sin(t * Math.PI) * 0.04;
          addTarget(x + rand(-0.015, 0.015), y + rand(-0.012, 0.012), Math.random() > 0.72 ? "wood" : "leaf", rand(0.34, 0.82), rand(0.4, 1.1));
        }

        for (let i = 0; i < 480; i++) {
          const x = rand(-0.5, 0.5);
          const y = 0.31 + Math.sin(x * 15) * 0.018 + rand(-0.018, 0.018);
          addTarget(x, y, Math.random() > 0.65 ? "dust" : "leafLight", rand(0.3, 0.75), rand(1.0, 2.3));
        }
      }

      function color(kind, alpha) {
        const c = palette[kind] || palette.dust;
        return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
      }

      function screenTarget(target) {
        const scale = Math.min(width, height) * 0.86;
        return {
          x: width * 0.5 + target.x * scale,
          y: height * 0.58 + target.y * scale
        };
      }

      function resize() {
        const rect = root.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = Math.max(520, rect.height);
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seed();
      }

      function seed() {
        particles.length = 0;
        for (const target of targets) {
          const point = screenTarget(target);
          particles.push({
            x: point.x + rand(-width * 0.45, width * 0.45),
            y: point.y + rand(-height * 0.34, height * 0.34),
            vx: rand(-0.7, 0.7),
            vy: rand(-0.7, 0.7),
            phase: rand(0, Math.PI * 2),
            life: rand(0.58, 1),
            scatterX: Math.cos(rand(0, Math.PI * 2)) * rand(0.25, 1.0),
            scatterY: Math.sin(rand(0, Math.PI * 2)) * rand(0.24, 0.88),
            scatterBias: rand(-1, 1),
            tumble: rand(-1, 1),
            sparkle: Math.random(),
            target
          });
        }
        meter.textContent = `${particles.length} particles`;
      }

      async function setupAudio() {
        if (audioContext) return;
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.78;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        source = audioContext.createMediaElementSource(track);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
      }

      function readRhythm() {
        if (!analyser || !frequencyData) {
          const t = performance.now() * 0.001;
          return Math.pow((Math.sin(t * 1.7) + 1) * 0.5, 1.8);
        }

        analyser.getByteFrequencyData(frequencyData);
        let sum = 0;
        const end = Math.floor(frequencyData.length * 0.62);
        for (let i = 0; i < end; i++) sum += frequencyData[i];
        const level = clamp((sum / end / 255 - 0.08) * 1.55, 0, 1);
        rhythmSmoothed = rhythmSmoothed * 0.86 + level * 0.14;
        return rhythmSmoothed;
      }

      function draw(time) {
        const t = time * 0.001;
        const rhythm = readRhythm();
        const intensity = 0.72;
        const magnet = 0.62;
        const cycleSpeed = 0.0028 + rhythm * 0.0085;
        previousCyclePhase = cyclePhase;
        cyclePhase = (cyclePhase + cycleSpeed) % 1;
        if (cyclePhase < previousCyclePhase) {
          cycleMode = (cycleMode + 1 + Math.floor(rhythm * 3.99)) % 4;
        }
        let release = 0;
        if (cyclePhase < 0.2) {
          release = 0;
        } else if (cyclePhase < 0.46) {
          release = Math.sin(((cyclePhase - 0.2) / 0.26) * Math.PI * 0.5);
        } else if (cyclePhase < 0.68) {
          release = 1;
        } else {
          release = Math.cos(((cyclePhase - 0.68) / 0.32) * Math.PI * 0.5);
        }
        const scatter = formed ? clamp(0.1 + (release * 0.76 + manualBurst) * intensity, 0.1, 0.94) : 0.82;
        const formClarity = 1 - clamp(scatter, 0, 1);
        const floatWave = (0.3 + rhythm * 0.52) * intensity;
        const pull = formed ? 0.028 + magnet * 0.068 + formClarity * 0.052 : 0.012;
        manualBurst *= 0.94;

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(1, 2, 1, 0.25)";
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width * 0.5, height * 0.55, 20, width * 0.5, height * 0.55, Math.min(width, height) * 0.6);
        glow.addColorStop(0, `rgba(246, 241, 209, ${0.009 + rhythm * 0.02})`);
        glow.addColorStop(0.36, `rgba(255, 159, 36, ${0.009 + rhythm * 0.022})`);
        glow.addColorStop(0.7, `rgba(148, 215, 85, ${0.007 + rhythm * 0.015})`);
        glow.addColorStop(1, "rgba(3, 4, 2, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        ctx.globalCompositeOperation = "source-over";
        for (const p of particles) {
          const target = screenTarget(p.target);
          const currentWave = t * (0.8 + p.target.drift) + p.phase + target.y * 0.01;
          const fruitFloat = p.target.kind === "orange" || p.target.kind === "orangeLight" ? 1.75 : 1;
          const oceanX = Math.sin(currentWave * 1.12 + target.y * 0.015) * (20 + 82 * floatWave) * fruitFloat;
          const oceanY = Math.cos(currentWave * 0.92 + target.x * 0.01) * (14 + 56 * floatWave) * fruitFloat;
          const driftCurl = Math.sin(currentWave * 0.73 + p.tumble * 3.2);
          const normalizedY = clamp((target.y - height * 0.16) / (height * 0.68), 0, 1);
          const upwardSweep = 1 - normalizedY;
          const downwardSweep = normalizedY;
          let modeX = p.scatterX;
          let modeY = p.scatterY;

          if (cycleMode === 1) {
            const sweep = 0.18 + upwardSweep * 1.25;
            modeX = p.scatterX * 0.72 + Math.sin(currentWave * 0.8 + normalizedY * 5) * 0.45;
            modeY = -sweep + p.scatterBias * 0.22;
          } else if (cycleMode === 2) {
            const sweep = 0.18 + downwardSweep * 1.25;
            modeX = p.scatterX * 0.72 + Math.cos(currentWave * 0.76 + normalizedY * 4) * 0.45;
            modeY = sweep + p.scatterBias * 0.22;
          } else if (cycleMode === 3) {
            modeX = p.scatterX * 1.15 + Math.sin(currentWave * 1.45) * 0.42;
            modeY = p.scatterY * 0.55 + Math.sin(normalizedY * Math.PI * 2 + t * 1.2 + p.phase) * 0.52;
          }

          const spreadX = (modeX + driftCurl * 0.24) * scatter * (98 + width * 0.15);
          const spreadY = (modeY + Math.cos(currentWave * 0.61) * 0.18) * scatter * (72 + height * 0.095);

          let tx = target.x + oceanX * scatter + spreadX;
          let ty = target.y + oceanY * scatter + spreadY;

          if (pointer.active) {
            const px = pointer.x * width;
            const py = pointer.y * height;
            const dx = p.x - px;
            const dy = p.y - py;
            const dist = Math.hypot(dx, dy) || 1;
            if (dist < 190) {
              tx += (dx / dist) * (190 - dist);
              ty += (dy / dist) * (190 - dist);
            }
          }

          p.vx += (tx - p.x) * pull * 0.03;
          p.vy += (ty - p.y) * pull * 0.03;
          p.vx += Math.sin(currentWave * 1.8) * 0.026 * floatWave;
          p.vy += Math.cos(currentWave * 1.45) * 0.026 * floatWave;
          p.vx *= 0.88;
          p.vy *= 0.88;
          p.x += p.vx;
          p.y += p.vy;

          const alpha = clamp(0.1 + p.life * 0.26 + rhythm * 0.07, 0, 0.52);
          const size = p.target.size * (0.94 + rhythm * 0.22 + scatter * 0.18);
          ctx.fillStyle = color(p.target.kind, alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();

          const flicker = 0.5 + 0.5 * Math.sin(t * (4.6 + p.sparkle * 6.5) + p.phase + scatter * 4.2);
          const glint = clamp((0.34 + rhythm * 0.32 + flicker * 0.34 + formClarity * 0.12) * p.life * 0.85, 0, 0.73);
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = `rgba(255, 255, 246, ${glint})`;
          ctx.beginPath();
          ctx.arc(p.x - size * 0.16, p.y - size * 0.18, Math.max(0.46, size * 0.48), 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
        }

        const modeNames = ["随机散聚", "下到上", "上到下", "横向漂移"];
        mode.textContent = playing ? `${modeNames[cycleMode]}  ${Math.round(formClarity * 100)}%` : "Demo loop";
        requestAnimationFrame(draw);
      }

      async function startAudio() {
        await setupAudio();
        if (audioContext.state === "suspended") await audioContext.resume();
        await track.play();
        playing = true;
        playButton.textContent = "暂停音乐";
        playButton.setAttribute("aria-pressed", "true");
      }

      playButton.addEventListener("click", async () => {
        if (track.paused) {
          await startAudio();
        } else {
          track.pause();
          playing = false;
          playButton.textContent = "播放音乐";
          playButton.setAttribute("aria-pressed", "false");
        }
      });

      scatterButton.addEventListener("click", () => {
        manualBurst = 1.08;
      });

      formButton.addEventListener("click", () => {
        formed = !formed;
        formButton.textContent = formed ? "聚成树" : "漂浮";
        formButton.setAttribute("aria-pressed", String(formed));
      });

      root.addEventListener("pointermove", (event) => {
        const rect = root.getBoundingClientRect();
        pointer = {
          x: (event.clientX - rect.left) / rect.width,
          y: (event.clientY - rect.top) / rect.height,
          active: true
        };
      });

      root.addEventListener("pointerleave", () => {
        pointer.active = false;
      });

      buildTree();
      resize();
      window.addEventListener("resize", resize);
      startAudio().catch(() => {
        mode.textContent = "点击播放音乐";
        playButton.textContent = "播放音乐";
        playButton.setAttribute("aria-pressed", "false");
      });
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
